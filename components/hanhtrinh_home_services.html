<div>

    <style>
/* =========================================================
   ELITE SERVICE - LIST
   ========================================================= */

#elite-services.elite-service__list {
    width: 100%;
    background: var(--LightBrown);
}


/* =========================================================
   ITEM
   Desktop / Tablet:
   - 2 cột
   - Chiều cao item tự theo content
   - Ảnh stretch bằng chiều cao content
   ========================================================= */

#elite-services .elite-service__item {
    display: grid;
    grid-template-columns: 40% 60%;
    align-items: stretch;

    width: 100%;

    overflow: hidden;

    background: var(--White);
    border-bottom: 1px solid var(--Stroke);
}

#elite-services .elite-service__item:last-child {
    border-bottom: none;
}


/* =========================================================
   IMAGE
   - Không min-height
   - Không aspect-ratio trên desktop
   - Luôn stretch theo chiều cao của grid item
   ========================================================= */

#elite-services .elite-service__image {
    width: 100%;
    height: 100%;

    overflow: hidden;
}

#elite-services .elite-service__image img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    transition: var(--ui-transition);
}

#elite-services .elite-service__item:hover
.elite-service__image img {
    transform: scale(1.02);
}


/* =========================================================
   CONTENT
   ========================================================= */

#elite-services .elite-service__content {
    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: flex-start;

    min-width: 0;

    padding: var(--ui-spacing-3xl) var(--ui-spacing-4xl);
}


/* =========================================================
   TITLE
   ========================================================= */

#elite-services .elite-service__title {
    width: 100%;

    margin: 0 0 var(--ui-spacing-md);

    font-family: var(--ui-font-family-display);
    font-size: var(--ui-font-size-h1);
    line-height: var(--ui-line-height-h1);
    font-weight: var(--ui-font-weight-bold);

    color: var(--Black);
}


/* =========================================================
   PRICE
   ========================================================= */

#elite-services .elite-service__price {
    margin-bottom: var(--ui-spacing-md);

    font-family: var(--ui-font-family);
    font-size: var(--ui-font-size-h5);
    line-height: var(--ui-line-height-h5);
    font-weight: var(--ui-font-weight-bold);

    color: var(--Button);
}


/* =========================================================
   LOCATION
   ========================================================= */

#elite-services .elite-service__location {
    display: inline-flex;
    align-items: center;

    gap: var(--ui-spacing-3xs, 4px);

    margin-bottom: var(--ui-spacing-md);

    font-family: var(--ui-font-family);
    font-size: var(--ui-font-size-base);
    line-height: var(--ui-line-height-caption);
    font-weight: var(--ui-font-weight-bold);

    color: var(--Black);
}

#elite-services .elite-service__location svg {
    flex-shrink: 0;

    width: 14px;
    height: 14px;
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

/*
 * {{description}} có thể render thành HTML trực tiếp.
 * Vì vậy style cả nội dung con bên trong content.
 */

#elite-services .elite-service__content > p,
#elite-services .elite-service__content > div:not(.elite-service__price):not(.elite-service__location) {
    width: 100%;
    max-width: 560px;

    margin: 0 0 var(--ui-spacing-lg);

    font-family: var(--ui-font-family);
    font-size: var(--ui-font-size-base);
    line-height: var(--ui-line-height-caption);
    font-weight: var(--ui-font-weight-normal);

    color: var(--Gray);
}


/* Nếu description render ra nhiều đoạn */
#elite-services .elite-service__content p {
    margin-top: 0;
}

#elite-services .elite-service__content p:last-child {
    margin-bottom: var(--ui-spacing-lg);
}


/* =========================================================
   BUTTON
   - Reuse button-type-2
   ========================================================= */

#elite-services .elite-service__button {
    text-decoration: none;
}


/* =========================================================
   LAPTOP
   1024px - 1279px
   ========================================================= */

@media (min-width: 1024px) and (max-width: 1279px) {

    #elite-services .elite-service__item {
        grid-template-columns: 40% 60%;
    }

    #elite-services .elite-service__content {
        padding: var(--ui-spacing-2xl) var(--ui-spacing-3xl);
    }

    #elite-services .elite-service__title {
        font-size: var(--ui-font-size-h2);
        line-height: var(--ui-line-height-h2);
        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__price {
        font-size: var(--ui-font-size-h5);
        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__location {
        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__content > p,
    #elite-services .elite-service__content > div:not(.elite-service__price):not(.elite-service__location) {
        max-width: 100%;
        margin-bottom: var(--ui-spacing-md);
    }
}


/* =========================================================
   TABLET
   768px - 1023px
   ========================================================= */

@media (min-width: 768px) and (max-width: 1023px) {

    #elite-services .elite-service__item {
        grid-template-columns: 42% 58%;
    }

    #elite-services .elite-service__content {
        padding: var(--ui-spacing-xl) var(--ui-spacing-2xl);
    }

    #elite-services .elite-service__title {
        font-size: var(--ui-font-size-h5);
        line-height: var(--ui-line-height-h5);

        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__price {
        font-size: var(--ui-font-size-base);

        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__location {
        font-size: var(--ui-font-size-base);

        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__content > p,
    #elite-services .elite-service__content > div:not(.elite-service__price):not(.elite-service__location) {
        max-width: 100%;

        margin-bottom: var(--ui-spacing-md);

        font-size: 14px;
        line-height: 1.5;
    }


    /* =====================================================
       BUTTON - TABLET
       ===================================================== */

    #elite-services .elite-service__button.button-type-2 {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        width: auto;
        min-width: 147px;
        height: 42px;

        padding: 0 18px;

        gap: 10px;

        border: 1px solid var(--Stroke, #A5846F);
        border-radius: 999px;

        background: var(--Button, #926E4A);
        color: var(--White, #FFF);

        font-family: Inter, sans-serif;
        font-size: 14px;
        font-style: normal;
        font-weight: 700;
        line-height: 150%;

        text-decoration: none;

        box-sizing: border-box;
    }

    #elite-services .elite-service__button.button-type-2 span {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        font-size: 18px;
        line-height: 1;
    }

    #elite-services .elite-service__button.button-type-2:hover,
    #elite-services .elite-service__button.button-type-2:active {
        border-color: var(--LightBrown, #EEE8DA);
        background: var(--DarkBrown, #836954);
        color: var(--White, #FFF);
    }
}


/* =========================================================
   MOBILE
   <= 767px
   ========================================================= */

@media (max-width: 767px) {

    #elite-services .elite-service__item {
        display: flex;
        flex-direction: column;

        width: 100%;
        height: auto;
    }


    /* =====================================================
       IMAGE MOBILE
       ===================================================== */

    #elite-services .elite-service__image {
        width: 100%;
        height: auto;

        aspect-ratio: 16 / 10;

        overflow: hidden;

        flex-shrink: 0;
    }

    #elite-services .elite-service__image img {
        width: 100%;
        height: 100%;

        object-fit: cover;
        object-position: center;
    }


    /* =====================================================
       CONTENT MOBILE
       ===================================================== */

    #elite-services .elite-service__content {
        width: 100%;

        padding: var(--ui-spacing-xl);

        gap: 0;
    }

    #elite-services .elite-service__title {
        width: 100%;

        margin: 0 0 var(--ui-spacing-sm);

        font-size: var(--ui-font-size-h5);
        line-height: var(--ui-line-height-h5);
    }

    #elite-services .elite-service__price {
        margin-bottom: var(--ui-spacing-sm);

        font-size: var(--ui-font-size-base);
    }

    #elite-services .elite-service__location {
        margin-bottom: var(--ui-spacing-sm);
    }

    #elite-services .elite-service__content > p,
    #elite-services .elite-service__content > div:not(.elite-service__price):not(.elite-service__location) {
        width: 100%;
        max-width: none;

        margin-bottom: var(--ui-spacing-md);

        font-size: var(--ui-font-size-base);
        line-height: 1.55;
    }


    /* =====================================================
       BUTTON MOBILE
       ===================================================== */

    #elite-services .elite-service__button.button-type-2 {
        padding: var(--ui-spacing-2xs) var(--ui-spacing-sm);
    }
}


/* =========================================================
   SMALL MOBILE
   <= 480px
   ========================================================= */

@media (max-width: 480px) {

    #elite-services .elite-service__image {
        aspect-ratio: 4 / 3;
    }

    #elite-services .elite-service__content {
        padding: var(--ui-spacing-lg);
    }

    #elite-services .elite-service__title {
        font-size: var(--ui-font-size-h6);
        line-height: var(--ui-line-height-h6);
    }

    #elite-services .elite-service__price {
        font-size: 14px;
    }

    #elite-services .elite-service__location {
        font-size: 14px;
    }

    #elite-services .elite-service__content > p,
    #elite-services .elite-service__content > div:not(.elite-service__price):not(.elite-service__location) {
        font-size: 14px;
        line-height: 1.5;
    }
}
</style>

    <section id="elite-services" class="content-p-H elite-service__list">

        <!-- ITEM 1 -->
        <article class="elite-service__item"
            repeat="category|param:parentId:0552f814-1c9e-a1da-2e86-e336d46faadf|sort:displayOrder:asc">

            <div class="elite-service__image">
                <img
                    src="{{images|getthumbnailbyindex:0|getPath:}}"
                    alt="SH Elite - Dịch vụ thượng lưu mặt đất" />
            </div>

            <div class="elite-service__content">

                <h2 class="elite-service__title">
                    {{name}}
                </h2>

                <div class="elite-service__price">
                    Đơn giá: {{subDescription}} VNĐ
                </div>

                <div class="elite-service__location">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">
                        <path
                            d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" />
                        <circle cx="12" cy="10" r="3" />
                    </svg>
                    Hà Nội
                </div>

                <!-- <p class="elite-service__description">
                   
                </p> -->
                {{description}}

                <a href="/san-pham"
                    class="elite-service__button button-type-2"
                    goto>
                    Xem chi tiết
                    <span>→</span>
                </a>

            </div>
        </article>

    </section>
</div>
