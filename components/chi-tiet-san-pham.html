<div>
    <style>
        #hanhtrinh-detail-shElite .elite-service__hero,
        #hanhtrinh-detail-shElite .address-section,
        #hanhtrinh-detail-shElite .detail-description {
            width: 100%;
            box-sizing: border-box;
        }

        #hanhtrinh-detail-shElite .elite-service__hero {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: center;
            gap: var(--ui-spacing-5xl);
            background: var(--LightBrown);
        }

        #hanhtrinh-detail-shElite .elite-service__hero-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            gap: var(--ui-spacing-md)
        }


        #hanhtrinh-detail-shElite .elite-service__price {
            color: #9a744c;
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size-body);
            font-weight: var(--ui-font-weight-bold);
            line-height: 1.4;
        }

        #hanhtrinh-detail-shElite .elite-service__hero-description {
            max-width: 520px;
            color: var(--Gray);
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size-body);
            font-weight: var(--ui-font-weight-normal);
            line-height: var(--ui-line-height-body);
        }

        #hanhtrinh-detail-shElite .elite-service__hero-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            overflow: hidden;
            border-radius: var(--ui-radius-xs);
        }

        #hanhtrinh-detail-shElite .elite-service__hero-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        #hanhtrinh-detail-shElite .elite-service__hero-content .button-type-2 {
            width: fit-content;

        }

        #hanhtrinh-detail-shElite .address-content {
            width: 100%;
        }

        #hanhtrinh-detail-shElite .address-title {
            margin: 0 0 var(--ui-spacing-xl);
            color: var(--Black);
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size-h4);
            font-weight: var(--ui-font-weight-bold);
            line-height: 1.3;
        }

        #hanhtrinh-detail-shElite .lounge__grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--ui-spacing-sm);
            width: 100%;
        }

        #hanhtrinh-detail-shElite .lounge__card {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: var(--ui-radius-xs);
            background: var(--Gray);
            text-decoration: none;
        }

        #hanhtrinh-detail-shElite .lounge__card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: var(--ui-transition);
        }

        #hanhtrinh-detail-shElite .lounge__card:hover img {
            transform: scale(1.03);
        }

        #hanhtrinh-detail-shElite .lounge__card-overlay {
            position: absolute;
            right: var(--ui-spacing-sm);
            bottom: var(--ui-spacing-sm);
            left: var(--ui-spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: var(--ui-spacing-sm) var(--ui-spacing-md);
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(4px);
            border-radius: var(--ui-radius-xs);
            box-sizing: border-box;
        }

        #hanhtrinh-detail-shElite .text-subTitle {
            margin: 0;
            color: var(--Black);
            font-family: var(--ui-font-family);
            font-size: var(--ui-font-size-body);
            font-weight: var(--ui-font-weight-normal);
            line-height: 1.4;
            text-align: center;
        }

        #hanhtrinh-detail-shElite .detail-description {
            color: var(--Black);
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            #hanhtrinh-detail-shElite .elite-service__hero {
                gap: var(--ui-spacing-xl);
            }

            #hanhtrinh-detail-shElite .elite-service__hero-description {
                font-size: var(--ui-font-size-sm);
            }

            #hanhtrinh-detail-shElite .lounge__grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            #hanhtrinh-detail-shElite .text-subTitle {
                font-size: var(--ui-font-size-sm);
            }
        }

        @media (max-width: 767px) {
            #hanhtrinh-detail-shElite .elite-service__hero {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: var(--ui-spacing-xl);
            }

            #hanhtrinh-detail-shElite .elite-service__hero-content {
                width: 100%;
            }

            #hanhtrinh-detail-shElite .elite-service__hero-description {
                max-width: none;
                font-size: var(--ui-font-size-sm);
            }

            #hanhtrinh-detail-shElite .elite-service__hero-image {
                width: 100%;
                aspect-ratio: 16 / 10;
            }

            #hanhtrinh-detail-shElite .lounge__grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }


            #hanhtrinh-detail-shElite .lounge__card-overlay {
                right: var(--ui-spacing-xs);
                bottom: var(--ui-spacing-xs);
                left: var(--ui-spacing-xs);

                min-height: 52px;
                padding: var(--ui-spacing-xs) var(--ui-spacing-sm);
            }

            #hanhtrinh-detail-shElite .text-subTitle {
                font-size: var(--ui-font-size-sm);
            }
        }

        @media (max-width: 480px) {


            #hanhtrinh-detail-shElite .elite-service__hero {
                gap: var(--ui-spacing-lg);
            }

            #hanhtrinh-detail-shElite .lounge__grid {
                grid-template-columns: 1fr;
                gap: var(--ui-spacing-sm);
            }
        }
    </style>
    <section id="hanhtrinh-detail-shElite" repeat="detaildata">
        <section class="content-p-H elite-service__hero">
            <div class="elite-service__hero-content">
                <h1 class="elite-service__hero-title">{{name}}</h1>

                <div class="elite-service__price">Đơn giá: {{price|formatmoney}}</div>

                <p class="elite-service__hero-description">{{subDescription}}</p>
                <a class="button-type-2" href binding-btnhref>
                    <span binding-btntext="Khám phá đặc quyền">Sử dụng đặc
                        quyền</span>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M17.414 10.586L13.121 6.293L11.707 7.707L15 11H5V13H15L11.707 16.293L13.121 17.707L17.414 13.414C17.7889 13.0389 17.9996 12.5303 17.9996 12C17.9996 11.4697 17.7889 10.9611 17.414 10.586Z"
                            fill="white"></path>
                    </svg>
                </a>
            </div>

            <div class="elite-service__hero-image">
                <img src="{{images|getthumbnailbyindex:0|getPath:}}" alt="{{name}}" />
            </div>
        </section>

        <section class="content-p-H address-section">
            <div class="address-content">
                <h2 class="address-title">Danh sách địa chỉ</h2>

                <div class="lounge__grid">
                    <a href="#address-{{id}}" class="lounge__card" repeat="addresses">
                        <img src="{{images|getthumbnailbyindex:0|getPath:}}" alt="{{name}}">
                        <!-- <img
              src="{{images|getPath:}}"
              alt="{{name}}"> -->
                        <!-- <img
              src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=900&q=80"
              alt="{{name}}" /> -->

                        <div class="lounge__card-overlay">
                            <p class="text-subTitle">{{name}}</p>
                            <!-- <div>{{images}}</div> -->
                        </div>
                    </a>
                </div>
            </div>
        </section>

        <div class="content-p-H detail-description">
            {{description}}
        </div>

</div>
