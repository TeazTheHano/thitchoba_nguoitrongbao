<div style="background: var(--DarkBrown, #836954)">
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
  <style>
    
    #section_header {
      background: var(--DarkBrown, #836954);
      color: var(--White, #fff);
      height: fit-content;
    }

    #section_header * {
      color: currentColor;
      text-decoration: none;
    }

    #section_header .menu-container-1-items {
      display: flex;
      flex-direction: row;
      align-items: center;
      height: 100%;
      gap: var(--ui-spacing-sm);
      justify-content: center;
    }

    #section_header #section_header_top {
      border: 2px solid var(--Stroke);
    }

    #section_header #logo_container {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: fit-content;
    }

    #section_header #logo_container img {
      height: var(--ui-spacing-7xl);
    }

    #section_header .menu-container-1-items p {
      font-family: inherit;
      font-weight: inherit;
      font-size: inherit;
      line-height: inherit;
      width: fit-content;
    }

    #section_header .button-type-1 {
      padding: var(--ui-spacing-md) var(--ui-spacing-md);
      width: 100%;
      border: 2px solid var(--Stroke);
      border-left-width: 2px;
      border-right-width: 2px;
      border-top-width: 0px;
      border-bottom-width: 0px;
      margin-inline: -1px;
    }

    #section_header #section_header_bottom {
      padding: var(--ui-spacing-xl) var(--ui-spacing-7xl);
      gap: var(--ui-spacing-xl);
      border: 2px solid var(--Stroke);
      border-top-width: 0px;
      display: none;
    }

    #section_header #section_header_bottom .left {
      justify-content: flex-end;
    }

    #section_header #section_header_bottom .right {
      gap: var(--ui-spacing-lg);
    }

    #section_header
      input[type="checkbox"]#menu-toggle:checked
      ~ #section_header_bottom {
      display: flex;
    }

    #section_header
      input[type="checkbox"]#menu-toggle:not(:checked)
      ~ #section_header_top
      label[for="menu-toggle"]
      svg:last-child {
      display: none;
    }

    #section_header
      input[type="checkbox"]#menu-toggle:checked
      ~ #section_header_top
      label[for="menu-toggle"]
      svg:first-of-type {
      display: none !important;
    }

    #section_header label[for="menu-toggle"] {
      position: relative;
    }

    #section_header
      input[type="checkbox"]#menu-toggle:checked
      ~ #section_header_top
      label[for="menu-toggle"]::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #ffffff1a;
      pointer-events: none; /* Không che thao tác click vào label */
    }
  </style>
